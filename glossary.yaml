# Nethesis Design System glossary: single source of truth.
#
# Edit this file through pull requests only. `npm run build:data` generates
# glossary/it.tbx (read by Weblate) and the data used by the web page.
#
# Add a term only once it has been agreed: every entry is exported to Weblate.
#
# Fields:
#   id              unique slug, used for links (#term-<id>) and TBX entry ids
#   en              preferred English term
#   it              preferred Italian translation (omit when untranslatable)
#   untranslatable  true when the term stays in English in every language
#   definition      what the term means, in one or two user oriented sentences
#   products        all | ns8 | nethsecurity | nethvoice | nethservice | neth360 | my
#   avoid.en        English words not to use for this concept
#   avoid.it        Italian translations not to use (forbidden on Weblate)
#   notes           optional: how to write it (examples, exceptions, Italian specifics)
#
# Example:
#
# - id: delete
#   en: Delete
#   it: Elimina
#   definition: Permanently destroy an object, such as a contact, a firewall rule or a user.
#   products: [all]
#   avoid:
#     it: [Cancella]

# Systems and subscriptions

- id: system-key
  en: System key
  it: Chiave di sistema
  definition: The public identifier of a system registered on My Nethesis.
  products: [my, ns8, nethsecurity]
  avoid:
    en: [System ID]
    it: [Chiave sistema, ID sistema]
  notes: 'Example: "NETH-1234-5678-9ABC-DEF0-1234-5678-9ABC-DEF0".'

- id: system-secret
  en: System secret
  it: Segreto di sistema
  definition: The credential a system uses to connect to My Nethesis. It is shown only once, when it is generated.
  products: [my, ns8, nethsecurity]
  avoid:
    en: [System token, Registration token, Authentication token]
    it: [Segreto del sistema, Token di sistema, Token di registrazione, Token di autenticazione]
  notes: >-
    Example: "my_0123456789abcdef0123.0123456789abcdef0123456789abcdef01234567". In Italian, use
    "Segreto di sistema" like "Chiave di sistema"; "il segreto del sistema <name>" is fine only
    for a specific system.

- id: subscription
  en: Subscription
  untranslatable: true
  definition: The plan of a registered system, such as Community or Enterprise.
  products: [all]
  avoid:
    en: [Registration]
    it: [Abbonamento, Sottoscrizione]
  notes: >-
    Do not call the subscription a "registration". Registering a system, that is connecting it
    to My Nethesis, is fine: "Register system".

- id: add-on
  en: Add-on
  untranslatable: true
  definition: An optional feature bought on NethShop and granted to a system, such as Threat Shield.
  products: [all]
  avoid:
    en: [Entitlement, Addon, Additional service]
    it: [Servizio aggiuntivo]
  notes: 'The Italian plural does not change: "gli add-on".'

- id: nethshop
  en: NethShop
  untranslatable: true
  definition: The Nethesis online shop for Nethesis products and services, such as add-ons, appliances and training.
  products: [my]
  avoid:
    en: [Nethshop]

- id: company
  en: Company
  it: Azienda
  definition: A distributor, a reseller or a customer in My Nethesis, with its users and systems.
  products: [my]
  avoid:
    en: [Organization]
    it: [Organizzazione]
  notes: 'Use "Company" for the generic case; use "Distributor", "Reseller" or "Customer" when the level matters.'

# Features

- id: threat-shield
  en: Threat Shield
  untranslatable: true
  definition: >-
    A security service that blocks malicious IP addresses and domains using blocklists.
  products: [nethsecurity, ns8]
  avoid:
    en: [Threat shield, ThreatShield]
  notes: 'Its parts are "Threat Shield IP" and "Threat Shield DNS".'

- id: multiwan
  en: MultiWAN
  untranslatable: true
  definition: The NethSecurity feature that uses several internet connections together, for load balancing or failover.
  products: [nethsecurity]
  avoid:
    en: [Multi WAN, Multi-WAN]

- id: flashstart
  en: FlashStart
  untranslatable: true
  definition: A third-party cloud filter that blocks unwanted websites through DNS, integrated in NethSecurity.
  products: [nethsecurity, my]
  avoid:
    en: [Flashstart]

# Actions

- id: create
  en: Create
  it: Crea
  definition: Make a new object that did not exist before, such as a user, a group or a firewall rule.
  products: [all]
  avoid:
    en: [New, Add]
  notes: >-
    Name the object: "Create user". Use "Add" when the object already exists and is only
    associated with another one.

- id: add
  en: Add
  it: Aggiungi
  definition: Associate an object that already exists, for example add a user to a group.
  products: [all]
  avoid:
    en: [Create, New]
  notes: 'Use "Create" when the object does not exist yet and is made from scratch.'

- id: edit
  en: Edit
  it: Modifica
  definition: Change the data of an object.
  products: [all]
  avoid:
    en: [Modify]

- id: delete
  en: Delete
  it: Elimina
  definition: Permanently destroy an object, such as a contact, a firewall rule or a user.
  products: [all]
  avoid:
    en: [Remove]
    it: [Cancella, Rimuovi]
  notes: >-
    Use "Remove" when the object only leaves a list or an association and still exists, for
    example a user removed from a group. For applications, use "Uninstall". When the deletion
    has consequences beyond the object itself, ask for confirmation first: see Delete confirmation
    in the guidelines. In My Nethesis, which archives objects before deleting them, the permanent
    action is "Destroy".

- id: remove
  en: Remove
  it: Rimuovi
  definition: Take an object out of a list or an association without destroying it, for example remove a user from a group.
  products: [all]
  avoid:
    en: [Delete]
    it: [Elimina]
  notes: Use "Delete" when the object is destroyed.

- id: uninstall
  en: Uninstall
  it: Disinstalla
  definition: Remove an application, with its data, from NethServer 8.
  products: [ns8]
  avoid:
    en: [Delete, Remove]
    it: [Elimina, Rimuovi]
  notes: 'Name the application: "Uninstall mail1".'

- id: archive
  en: Archive
  it: Archivia
  definition: Take an object out of use without destroying it, so that it can be restored, such as a user, a system or a company.
  products: [my]
  notes: >-
    Only in products that keep archived objects. Its opposite is "Restore"; the action that
    removes an archived object for good is "Destroy".

- id: restore
  en: Restore
  it: Ripristina
  definition: Bring back something kept earlier, such as an archived object or the configuration saved in a backup.
  products: [all]
  notes: '"Restore user" ("Ripristina utente"), "Restore backup" ("Ripristina backup"). For default values, use "Reset".'

- id: destroy
  en: Destroy
  it: Elimina definitivamente
  definition: Permanently delete an archived object, which can no longer be restored.
  products: [my]
  notes: >-
    Only in products that archive objects before deleting them, where it takes the place of
    "Delete". In Italian, drop "definitivamente" when the object follows: "Destroy user"
    ("Elimina utente").

- id: enable
  en: Enable
  it: Abilita
  definition: Turn on a feature or an option.
  products: [all]
  avoid:
    en: [Activate]
    it: [Attiva]
  notes: 'The resulting state is "Enabled" ("Abilitato", not "Attivato").'

- id: disable
  en: Disable
  it: Disabilita
  definition: Turn off a feature or an option.
  products: [all]
  avoid:
    en: [Deactivate]
    it: [Disattiva]
  notes: 'The resulting state is "Disabled" ("Disabilitato", not "Disattivato").'

- id: clear
  en: Clear
  it: Azzera
  definition: Empty a search field, a selection or a filter.
  products: [all]
  avoid:
    it: [Pulisci, Svuota, Cancella]
  notes: >-
    "Clear" empties values; "Reset" brings them back to their defaults. For filters, use "Clear
    selection" ("Azzera selezione") only inside a single dropdown filter that has nothing
    selected by default, "Clear filter" ("Azzera filtro") when the only filter of a table or a
    collection is a text filter, and "Reset" in every other case: see the Table filters
    guidelines. The clear button of a search field is "Clear search" ("Azzera ricerca").

- id: reset
  en: Reset
  it: Reimposta
  definition: Bring values back to their defaults, for example the filters of a list.
  products: [all]
  avoid:
    it: [Ripristina]
  notes: >-
    "Reset filters" ("Reimposta filtri"), "Reset selection" ("Reimposta selezione"), "Reset
    password" ("Reimposta password"). In Italian, "Ripristina" is for restoring a backup.

- id: details
  en: Details
  it: Dettagli
  definition: The button that opens the page of an object, in a table row or a card.
  products: [all]
  avoid:
    en: [View, See details, View details]
    it: [Visualizza]
  notes: >-
    An exception to the verb rule for buttons, for brevity: always with the eye icon, and with the
    object name for screen readers. "Show details" is for content that opens in place.

- id: sign-in
  en: Sign in
  it: Accedi
  definition: Enter a product with your credentials.
  products: [all]
  avoid:
    en: [Log in, Login, Signin]
    it: [Login, Effettua il login]
  notes: >-
    "Login" is fine as a noun or modifier: "Login failed", "last login", "root login". Queue
    login in NethVoice is a different concept: agents "log in to" and "log out of" a queue.

- id: sign-out
  en: Sign out
  it: Esci
  definition: Leave a product and end your session.
  products: [all]
  avoid:
    en: [Log out, Logout, Log off]
    it: [Disconnetti, Logout]

# Accounts

- id: username
  en: Username
  it: Nome utente
  definition: The name a user signs in with.
  products: [all]
  avoid:
    en: [User name]
    it: [Utente, Username]
  notes: 'Translate it also in short labels: "Username and password" is "Nome utente e password", not "Utente e password".'

# Monitoring

- id: alert
  en: Alert
  it: Allarme
  definition: A notice raised when a monitored condition needs attention, such as a full disk or too many calls waiting in a queue.
  products: [all]
  avoid:
    en: [Alarm]

# Backup

- id: backup-destination
  en: Backup destination
  it: Destinazione di backup
  definition: A storage location where backups are saved.
  products: [ns8]
  avoid:
    en: [Backup repository]
    it: [Repository di backup]

# Product names

- id: my-nethesis
  en: My Nethesis
  untranslatable: true
  definition: >-
    The Nethesis administration portal, where systems are registered and managed.
  products: [all]
  avoid:
    en: [My, my.nethesis.it]
  notes: >-
    Write "My Nethesis" in full. "My" is only an informal short form, not used in user
    interfaces. To refer to it indirectly, "Nethesis administration portal" ("portale di
    amministrazione Nethesis") is also correct.

- id: nethserver
  en: NethServer
  untranslatable: true
  definition: >-
    The Nethesis open source server for small and medium businesses. From a web interface,
    it installs and manages applications, such as mail, file sharing and NethVoice, on one
    or more nodes.
  products: [all]
  avoid:
    en: [Nethserver, NS8]
  notes: '"NethServer 8", with the version, is also correct. Do not shorten it to "NS8".'

- id: nethsecurity
  en: NethSecurity
  untranslatable: true
  definition: >-
    The Nethesis open source firewall for small and medium businesses, based on OpenWrt.
    Many installations can be managed from NethServer 8 with the NethSecurity controller.
  products: [all]
  avoid:
    en: [Nethsecurity, Nsec]
  notes: 'Each installation is called a "unit".'

- id: unit
  en: Unit
  it: Unità
  definition: A single NethSecurity installation, such as one managed by the NethSecurity controller.
  products: [nethsecurity]
  avoid:
    en: [Firewall unit, Firewall, Device]
    it: [Unità firewall, Dispositivo, Firewall]
  notes: >-
    Call the installation "unit", also in technical texts: "The unit IP address", "Reset the
    unit". "Firewall" stays correct for the feature, as in "firewall rules", and for the kind of
    product, as in "NethSecurity is a firewall".

- id: nethvoice
  en: NethVoice
  untranslatable: true
  definition: >-
    The Nethesis business phone system (VoIP PBX), installed as an application on
    NethServer 8. It includes NethVoice CTI, the web app users make and receive calls with,
    NethLink, its desktop app, and a mobile app also called NethVoice.
  products: [all]
  avoid:
    en: [Nethvoice]

- id: nethvoice-cti
  en: NethVoice CTI
  untranslatable: true
  definition: The NethVoice web app for users, to make and receive calls and manage contacts, call history and presence.
  products: [nethvoice]
  avoid:
    en: [NethCTI, CTI]
  notes: >-
    Write the full name. Exception: inside NethVoice, "CTI" alone is fine when the context is
    clear. The mobile app is called "NethVoice", not "NethCTI".

- id: nethlink
  en: NethLink
  untranslatable: true
  definition: The NethVoice CTI desktop app. It shows call notifications even when the browser is closed and supports click-to-call.
  products: [nethvoice]
  avoid:
    en: [Nethlink]

# Applications

- id: application
  en: Application
  it: Applicazione
  definition: Software installed on NethServer 8 from the Software center, such as Mail, Nextcloud or NethVoice.
  products: [ns8, my]
  avoid:
    en: [App]
    it: [App]
  notes: >-
    Always prefer "Application" to "Instance"; use "Instance" only when strictly necessary. "App"
    is fine for mobile and desktop apps, such as NethLink or the NethVoice mobile app.

- id: instance
  en: Instance
  it: Istanza
  definition: A single installed copy of an application, such as mail1. The same application can be installed more than once.
  products: [ns8]
  notes: >-
    Use "Instance" only when the context strictly requires one specific copy of an application,
    and "Application" would be misleading: for example, to choose among several copies of the
    same application ("Choose a NethVoice instance"). In every other case, use "Application".

- id: webtop
  en: WebTop
  untranslatable: true
  definition: The groupware application for mail, calendars, contacts and shared documents, installed on NethServer 8.
  products: [ns8, nethservice]
  avoid:
    en: [Webtop]

- id: nextcloud
  en: Nextcloud
  untranslatable: true
  definition: The third-party application for file sharing and collaboration, installed on NethServer 8.
  products: [ns8, nethservice]
  avoid:
    en: [NextCloud]
